<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1673d1"/>
      <stop offset="1" stop-color="#0a4a8c"/>
    </linearGradient>
    <clipPath id="ball"><circle r="148"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Pilota de voleibol -->
  <g transform="translate(232 232)">
    <circle r="148" fill="#ffffff"/>
    <g clip-path="url(#ball)" fill="none" stroke="#0b5cab" stroke-width="15" stroke-linecap="round">
      <g id="panel">
        <path d="M0 0 C 70 -40, 90 -110, 50 -160"/>
        <path d="M58 -8 C 120 -50, 140 -110, 110 -150"/>
      </g>
      <use href="#panel" transform="rotate(120)"/>
      <use href="#panel" transform="rotate(240)"/>
    </g>
    <circle r="148" fill="none" stroke="#0b5cab" stroke-width="10"/>
  </g>
  <!-- Vídeo -->
  <circle cx="384" cy="384" r="88" fill="#f2b705" stroke="#0a4a8c" stroke-width="14"/>
  <path d="M358 342 L 422 384 L 358 426 Z" fill="#0a4a8c"/>
</svg>
