name: Aplicacions

# Compila les aplicacions instal·lables:
#  - Windows (.msi i .exe) i Linux (.deb, .AppImage, .rpm) amb Tauri
#  - Android (.apk) amb Capacitor
# S'executa quan canvia la versió de package.json a la branca main, en
# publicar una etiqueta de versió (v0.8.0…) o manualment. Excepte en
# l'execució manual, es crea una "Release" v<versió> amb tots els fitxers.
#
# Opcional: les variables del repositori SUPABASE_URL i SUPABASE_ANON_KEY
# (Settings → Secrets and variables → Actions → Variables) fan que les
# aplicacions ja vinguin connectades al servidor del club. Si no hi són,
# l'aplicació ho demana la primera vegada que s'obre.

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - package.json
      - src-tauri/**
      - .github/workflows/apps.yml

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

jobs:
  desktop:
    name: Escriptori (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dependències del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm install --no-audit --no-fund
      - name: Compila l'aplicació d'escriptori
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: escriptori-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Projecte Android
        run: npx cap add android
      - name: Icones i pantalla d'inici
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android --assetPath assets
      - run: npx cap sync android
      - name: Compila l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Nom del fitxer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "VoleiVidIA-v$(node -p "require('./package.json').version").apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: VoleiVidIA-*.apk

  release:
    name: Publica la versió
    if: github.event_name == 'push'
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versió
        id: ver
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: fitxers
          merge-multiple: true
      - run: ls -R fitxers
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Volei VidIA ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag }}
          body: |
            Aplicacions instal·lables de Volei VidIA.

            - **Windows**: `.msi` o `.exe` (instal·lador).
            - **Linux**: `.deb` (Ubuntu/Debian/Linkat), `.rpm` (Fedora) o `.AppImage` (qualsevol distribució).
            - **Android**: `.apk` (cal permetre la instal·lació d'aplicacions de fonts desconegudes).

            La primera vegada que s'obre, l'aplicació demana l'adreça i la clau del servidor Supabase del club.
          files: fitxers/**/*
