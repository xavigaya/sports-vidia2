name: Web

# Publica la versió de navegador a GitHub Pages:
#   https://xavigaya.github.io/volei-vidia/
# S'actualitza a cada canvi a la branca main.
# Cal activar-ho un cop: Settings → Pages → Source: GitHub Actions.
#
# Recomanat: les variables del repositori SUPABASE_URL i SUPABASE_ANON_KEY
# (Settings → Secrets and variables → Actions → Variables). Sense elles,
# cada navegador demana l'adreça i la clau del servidor el primer cop.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: Pàgina per a adreces desconegudes
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
